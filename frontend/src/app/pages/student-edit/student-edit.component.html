<app-sidebar></app-sidebar>
<div style="margin-left: 200px">
  <div class="card-body" *ngIf="isLoading">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden"></span>
      </div>
    </div>
  </div>

  <div class="card m-3" *ngIf="!isLoading">
    <h5 class="card-header">Edit a student</h5>
    <div class="card-body">
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group col-6">
            <label>First Name</label>
            <input
              type="text"
              formControlName="firstName"
              class="form-control"
            />
          </div>
          <div class="form-group col-6">
            <label>Last Name</label>
            <input
              type="text"
              formControlName="lastName"
              class="form-control"
            />
          </div>
        </div>
        <div class="form-group">
          <label>Login</label>
          <input
            type="text"
            formControlName="login"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Change Password</label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
          />
        </div>
        <div class="text-center">
          <button class="btn btn-primary mr-1" type="submit" [disabled]="submitted || editForm.invalid">
            <span *ngIf="!isLoading">Save</span>
            <span *ngIf="isLoading" >
            <mat-spinner diameter="25" class="spinner-white"></mat-spinner>
          </span>
          </button>
          <button class="btn btn-secondary" type="reset" (click)="onReset()">
            Cancel
          </button>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
